<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aarix Voice Studio</title>
<style>
:root{
  --bg:#fff; --bg2:#f7f7f8; --card:#fff; --ink:#0b0b0c; --ink2:#3a3b40; --muted:#6e7179;
  --line:#e7e7ea; --line2:#d6d6dc; --soft:#f3f3f5; --pri:#0b0b0c; --pfg:#fff;
  --tag:#9333ea; --tagbg:#f3edff; --danger:#dc2626;
  --sh:0 1px 2px rgba(16,16,20,.05),0 4px 14px rgba(16,16,20,.05); --sh2:0 12px 40px rgba(16,16,20,.16);
  --ed:17px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",Arial,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
.hidden{display:none!important}
.muted{color:var(--muted)} .tiny{font-size:12px}
svg{display:block}
:focus-visible{outline:none}

/* LOGIN */
#login{display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px 18px}
.lbox{width:min(400px,100%); text-align:center}
.logo{width:60px; height:60px; border-radius:16px; background:var(--pri); color:var(--pfg); display:grid; place-items:center; font-weight:800; font-size:20px; margin:0 auto}
.lbox h1{margin:18px 0 6px; font-size:26px; letter-spacing:-.4px}
.lbox p{margin:0 0 26px; color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--line2); background:var(--card); font-weight:600; font-size:14px; white-space:nowrap; transition:.15s}
.btn.pri{background:var(--pri); color:var(--pfg); border-color:var(--pri)}
.btn:active{transform:scale(.97)}

/* TOPBAR */
#topbar{position:sticky; top:0; z-index:20; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; height:calc(58px + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 14px 0 10px; background:var(--bg); border-bottom:1px solid var(--line)}
#topbar h2{margin:0; font-size:16px; font-weight:700; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#topbar .r{display:flex; align-items:center; gap:8px}
.logo-sm{width:36px; height:36px; border-radius:10px; background:var(--pri); color:var(--pfg); display:grid; place-items:center; font-weight:800; font-size:13px; flex:none}
.ibtn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ink); flex:none}
.ibtn:hover{background:var(--soft)}
.avbtn{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; background:#ec4899; flex:none}

/* STUDIO */
#studio .page{max-width:720px; margin:0 auto; padding:16px 16px 230px}

/* Voice Pill */
.voicebtn{display:inline-flex; width:auto; max-width:100%; height:auto; padding:7px 14px 7px 7px; gap:8px; border:1px solid var(--line); border-radius:999px; background:var(--card); margin:0 0 16px; box-shadow:0 1px 2px rgba(0,0,0,.04); align-items:center; text-align:left}
.voicebtn .av{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,#6366f1,#ec4899)!important; flex:none}
.voicebtn .av svg{width:14px; height:14px}
.voicebtn .nm{flex:none; line-height:1}
.voicebtn .nm b{font-size:13.5px; font-weight:600; color:var(--ink); letter-spacing:-.1px}

/* Editor */
.edcard{border:0; background:none; padding:0; margin:0}
.hl,#script{font-size:17px; line-height:1.65; padding:0; letter-spacing:-.1px; font-family:inherit; width:100%; border:0; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; margin:0}
.hl{position:absolute; inset:0; pointer-events:none; color:var(--ink)}
.hl mark{background:none; color:var(--tag); border-radius:0; font-weight:500}
#script{position:relative; display:block; background:transparent; color:transparent; caret-color:var(--ink); resize:none; outline:none; min-height:140px; overflow:hidden}
#script::placeholder{color:var(--muted)}
#script::selection{background:rgba(168,85,247,.25); color:transparent}
.editor{position:relative; min-height:140px}

/* Add Speaker */
.addchar{margin:22px auto 0; width:auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:99px; justify-content:center}
.addchar:hover{background:var(--soft); color:var(--ink)}
.addchar svg{width:15px; height:15px}

/* BOTTOM BAR */
.bottombar{position:fixed; left:0; right:0; bottom:0; z-index:12; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line)}
.bb{max-width:720px; margin:auto}
.toolrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px}
.atgroup{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--card)}
.atb{padding:8px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px}
.atb svg{width:15px; height:15px}
.atd{border-left:1px solid var(--line); padding:8px 11px; display:grid; place-items:center; color:var(--muted)}
.icacts{display:flex; gap:8px}
.cib{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; color:var(--ink); padding:0}
.cib svg{width:16px; height:16px}
#gen{width:100%; padding:14px; border-radius:12px; font-size:15px; font-weight:600; background:#111; color:#fff; border:0; margin-bottom:12px}
#gen:active{transform:scale(.98)}
#stop{width:100%; padding:14px; border-radius:12px; font-size:15px; font-weight:600; background:var(--danger); color:#fff; border:0; margin-bottom:12px}
.fstats{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding:0 2px}
#charCount{color:var(--muted)}

/* SHEET */
.sheetwrap{position:fixed; inset:0; z-index:50; background:rgba(10,10,14,.42); display:none; align-items:flex-end; justify-content:center}
.sheetwrap.show{display:flex}
.sheet{background:var(--card); width:min(720px,100%); max-height:90vh; border-radius:22px 22px 0 0; display:flex; flex-direction:column}
.sheet.tall{height:92vh}
.handle{height:4px; width:40px; background:var(--line2); border-radius:9px; margin:10px auto 4px}
.shead{display:flex; align-items:center; justify-content:space-between; padding:4px 12px 8px 18px}
.shead b{font-size:17px}
.searchbox{display:flex; align-items:center; gap:10px; border:1px solid var(--line2); border-radius:12px; padding:0 12px; margin:2px 16px 10px; background:var(--card)}
.searchbox input{border:0; outline:0; background:transparent; flex:1; height:44px}
.sbody{overflow:auto; padding:4px 12px calc(24px + env(safe-area-inset-bottom)); flex:1}
.vrow{display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:14px; cursor:pointer}
.vrow:hover{background:var(--soft)}
.vrow .av{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:17px}
.vt{flex:1}
.vt b{display:block; font-size:14px}
.vt small{color:var(--muted); font-size:12px}
.chk{color:var(--ink); font-weight:800}

/* MISC */
.toast{position:fixed; left:50%; top:calc(68px + env(safe-area-inset-top)); transform:translate(-50%,12px); background:var(--pri); color:var(--pfg); padding:10px 14px; border-radius:12px; font-size:13px; z-index:90; opacity:0; pointer-events:none; transition:.22s; max-width:90%; box-shadow:var(--sh2)}
.toast.show{opacity:1; transform:translate(-50%,0)}
.atmenu{position:absolute; bottom:calc(100% + 8px); left:0; min-width:240px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px; box-shadow:var(--sh2); display:none; z-index:5}
.atmenu.show{display:block}
.atmenu .mi{display:flex; align-items:center; gap:12px; width:100%; padding:10px; border-radius:10px; text-align:left; font-size:14px}
.atmenu .mi:hover{background:var(--soft)}
.tagrow{display:flex; flex-wrap:wrap; gap:6px; padding:6px; max-height:170px; overflow-y:auto}
.tagrow button{background:var(--tagbg); color:var(--tag); border-radius:99px; padding:6px 12px; font-size:12px; font-weight:600}
.pop{position:relative}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="lbox">
    <div class="logo">AV</div>
    <h1>Aarix Voice Studio</h1>
    <p>Your expressive AI voice workspace</p>
    <button class="btn pri" id="guestLogin" style="width:100%">Continue as Guest</button>
  </div>
</section>

<!-- TOPBAR -->
<header id="topbar" class="hidden">
  <div><button class="logo-sm">AV</button></div>
  <h2>Text to Speech</h2>
  <div class="r">
    <button class="ibtn" aria-label="API Key">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    </button>
    <button class="avbtn" id="profileBtn">G</button>
  </div>
</header>

<!-- STUDIO -->
<section id="studio" class="hidden">
  <div class="page">
    <button class="voicebtn" id="openVoices">
      <span class="av">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
      </span>
      <span class="nm"><b id="vbName">Bunty - Funny Best Friend</b></span>
    </button>

    <div class="edcard">
      <div class="editor">
        <div class="hl" id="hl"></div>
        <textarea id="script" spellcheck="false" placeholder="Write or paste your script here…">[excited] Iron Man वाला Jarvis सिर्फ़ फ़िल्मों में नहीं होता, [thoughtful] तुम भी अपना खुद का Jarvis बना सकते हो... [happy] वो भी फ्री में! 😎</textarea>
      </div>
    </div>

    <button class="addchar" id="addChar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>वक्ता जोड़ें</span>
    </button>
  </div>

  <div class="bottombar">
    <div class="bb">
      <div class="toolrow">
        <div class="pop">
          <div class="atmenu" id="atMenu">
            <button class="mi" id="atRemove"><span>Remove all tags</span></button>
            <div style="font-size:11px; font-weight:600; padding:10px 10px 2px; color:var(--muted); border-top:1px solid var(--line); margin-top:4px">Insert a tag</div>
            <div class="tagrow" id="tagrow"></div>
          </div>
          <div class="atgroup">
            <button class="atb" id="autoTag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
              <span>ऑटो-टैग</span>
            </button>
            <button class="atd" id="atDrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
        </div>
        <div class="icacts">
          <button class="cib" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="cib" title="History">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
          </button>
        </div>
      </div>
      
      <button id="gen">स्पीच उत्पन्न करें</button>
      <button id="stop" class="hidden">Stop</button>

      <div class="fstats">
        <span id="charCount">0 / 100,000</span> 
      </div>
    </div>
  </div>
</section>

<!-- VOICE SHEET -->
<div class="sheetwrap" id="voiceW">
  <section class="sheet tall">
    <div class="handle"></div>
    <div class="shead"><b>Choose a voice</b><button class="ibtn" onclick="document.getElementById('voiceW').classList.remove('show')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="searchbox"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input placeholder="Search voices…"></div>
    <div class="sbody" id="vlist">
      <div class="vrow"><div class="av" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">B</div><div class="vt"><b>Bunty - Funny Best Friend</b><small>Hindi · Male</small></div><div class="chk">✓</div></div>
      <div class="vrow"><div class="av" style="background:linear-gradient(135deg,#10b981,#0ea5e9)">A</div><div class="vt"><b>Aanya - Sweet</b><small>Hindi · Female</small></div></div>
      <div class="vrow"><div class="av" style="background:linear-gradient(135deg,#f97316,#ec4899)">R</div><div class="vt"><b>Rahul - Deep</b><small>English · Male</small></div></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// Init
$("guestLogin").addEventListener("click", () => {
  $("login").style.display = "none";
  $("topbar").classList.remove("hidden");
  $("studio").classList.remove("hidden");
});

$("openVoices").addEventListener("click", () => {
  $("voiceW").classList.add("show");
});

// Highlight logic
const script = $("script"), hl = $("hl");
function updateHL() {
  let text = script.value;
  hl.innerHTML = text.replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>') + '<br>';
}
script.addEventListener("input", () => {
  updateHL();
  script.style.height = 'auto';
  script.style.height = script.scrollHeight + 'px';
  $("charCount").textContent = script.value.length.toLocaleString() + " / Unlimited";
});
updateHL();

// Add character
$("addChar").addEventListener("click", () => {
  showToast("Character feature coming soon!");
});

// Auto tag menu
const atMenu = $("atMenu");
$("atDrop").addEventListener("click", (e) => {
  e.stopPropagation();
  atMenu.classList.toggle("show");
});
$("autoTag").addEventListener("click", () => {
  showToast("Auto tagging...");
  atMenu.classList.remove("show");
});
document.addEventListener("click", (e) => {
  if (!atMenu.contains(e.target) && e.target !== $("atDrop")) {
    atMenu.classList.remove("show");
  }
});

// Tags list
const tags = ["[excited]", "[thoughtful]", "[happy]", "[whispers]", "[laughs]", "[sad]", "[angry]", "[curious]"];
tags.forEach(t => {
  let b = document.createElement("button");
  b.textContent = t;
  b.onclick = () => {
    script.value += " " + t;
    updateHL();
    atMenu.classList.remove("show");
  };
  $("tagrow").appendChild(b);
});
$("atRemove").onclick = () => {
  script.value = script.value.replace(/\[[^\]]+\]/g, '').replace(/\s+/g, ' ').trim();
  updateHL();
  atMenu.classList.remove("show");
};

// Fake generation
$("gen").onclick = () => {
  if (!script.value.trim()) {
    showToast("Write something first!");
    return;
  }
  $("gen").classList.add("hidden");
  $("stop").classList.remove("hidden");
  showToast("Generating...");
  
  setTimeout(() => {
    $("stop").classList.add("hidden");
    $("gen").classList.remove("hidden");
    showToast("Audio ready! (Unlimited credits)");
  }, 2000);
};

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
